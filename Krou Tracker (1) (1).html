 const ds=[...Array(7)].map((_,i)=>{const d=new Date(day+'T12:00');d.setDate(d.getDate()-6+i);return iso(d)});
 const T=ds.map(d=>tot(S.log[d]||[])),g=goal(0),mx=Math.max(g,...T.map(t=>t[0]))*1.1;
 const bars=ds.map((d,i)=>{const h=T[i][0]/mx*100,x=8+i*44;return `<rect x='${x}' y='${110-h}' width='30' height='${h}' rx='5' fill='${T[i][0]>g?'var(--f)':'var(--g)'}'/><text x='${x+15}' y='126' text-anchor='middle' font-size='11' fill='var(--mute)'>${new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'narrow'})}</text>`}).join('');
 const gy=110-g/mx*100,avg=i=>fmt(T.reduce((a,t)=>a+t[i],0)/7,i);
 const W=S.wt||{},wk=Object.keys(W).sort().slice(-30);let wc='';
 if(wk.length>1){const vs=wk.map(k=>W[k]),lo=Math.min(...vs)-1,hi=Math.max(...vs)+1;wc=`<svg viewBox='0 0 320 110' width='100%' role='img' aria-label='Weight trend'><polyline fill='none' stroke='var(--g)' stroke-width='3' stroke-linejoin='round' points='${vs.map((v,i)=>`${10+i*300/(vs.length-1)},${100-(v-lo)/(hi-lo)*90}`).join(' ')}'/></svg>`}
 const last=wk.length?W[wk[wk.length-1]]:null;
 return wsum()+`<div class='card'><div class='mh'><span>Last 7 days</span><span class='mute'>avg ${avg(0)} kcal</span></div><svg viewBox='0 0 320 135' width='100%' role='img' aria-label='Calories per day'><line x1='0' x2='320' y1='${gy}' y2='${gy}' stroke='var(--mute)' stroke-dasharray='4 4'/>${bars}</svg><div class='mute'>Avg P ${avg(1)} · C ${avg(2)} · F ${avg(3)} g. Dashed line is your calorie goal; red bars are over it.</div></div><div class='card'><div class='mh'><span>Weight</span><span class='mute'>${last!=null?last+' kg':'no entries yet'}</span></div>${wc}<div class='grid' style='margin-top:8px'><input id='wi' type='number' inputmode='decimal' step='0.1' min='1' placeholder='kg' aria-label='Weight in kg'><button class='pri' style='margin:0' onclick='sw()'>Save for this day</button></div></div>`}
function sw(){const v=parseFloat($('#wi').value);if(!(v>0))return;S.wt=S.wt||{};S.wt[day]=v;save();render()}
const share=mi=>{const s=S.split||[25,10,30,10,25],t=s.reduce((a,b)=>a+b,0)||1;return s[mi]/t};
function bar(v,g){const p=v/g*100;return `<div class='bar'><i style='width:${Math.min(p,100)}%;background:${p>100?'var(--f)':'var(--g)'}'></i></div>`}
function splitCard(){const s=S.split||[25,10,30,10,25];return `<div class='card'><b>Calories per meal (%)</b><p class='mute'>Your daily calories are divided by these shares, and each nutrient target follows. Shares are scaled to add up to 100%.</p><div class='grid'>${MEALS.map((m,i)=>`<div><label for='sp${i}'>${m} · ${Math.round(goal(0)*share(i))} kcal</label><input id='sp${i}' type='number' inputmode='decimal' min='0' value='${s[i]}' onchange='setSplit(${i},this.value)'></div>`).join('')}</div></div>`}
function setSplit(i,v){v=parseFloat(v);if(v>=0){S.split=S.split||[25,10,30,10,25];S.split[i]=v;save();render()}}
const CU={};function cu(){document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,f=CU[el.id]??0,t0=performance.now();CU[el.id]=n;(function s(t){const p=Math.min((t-t0)/700,1);el.textContent=Math.round(f+(n-f)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s)})(t0)})}
function confetti(){const c=['#3B82F6','#F59E0B','#EF4444','#10B981'];for(let i=0;i<36;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}%;background:${c[i%4]};animation-delay:${Math.random()*.4}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}}
function phIn(p){return `<label class='mute' for='phf'>Photo (optional)</label><input id='phf' type='file' accept='image/*' onchange='getPhoto(this)'><img id='php' class='ph' style='width:64px;height:64px;margin-top:6px;${p?'':'display:none'}' src='${p||''}' alt='Dish photo'>`}
function getPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,200/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);SH.ph=c.toDataURL('image/jpeg',.7);const pp=$('#php');if(pp){pp.src=SH.ph;pp.style.display='block'}};im.src=r.result};r.readAsDataURL(f)}
function calcCard(){const P=S.prof||{},o=(v,t,c)=>`<option value='${v}'${String(c)===String(v)?' selected':''}>${t}</option>`,inp=(id,t,v)=>`<div><label for='${id}'>${t}</label><input id='${id}' type='number' inputmode='decimal' min='1' value='${v||''}'></div>`;return `<div class='card'><b>Goal calculator</b><p class='mute'>Enter your details to set calories, protein, carbs and fat automatically.</p><div class='grid'><div><label for='cs'>Sex</label><select id='cs'>${o('f','Female',P.s)}${o('m','Male',P.s)}</select></div>${inp('ca','Age',P.a)}${inp('ch','Height (cm)',P.h)}${inp('cw','Weight (kg)',P.w)}${inp('ct','Target weight (kg)',P.t)}<div><label for='cac'>Activity</label><select id='cac'>${o(1.2,'Little or none',P.ac||1.375)}${o(1.375,'Light (walking)',P.ac||1.375)}${o(1.55,'Moderate',P.ac||1.375)}${o(1.725,'Very active',P.ac||1.375)}</select></div><div><label for='cp'>Pace (kg per week)</label><select id='cp'>${o(0.25,'0.25 slow',P.pc||0.5)}${o(0.5,'0.5 steady',P.pc||0.5)}${o(0.75,'0.75 fast',P.pc||0.5)}</select></div></div><button class='pri' onclick='calc()'>Set my goals</button>${S.calcMsg?`<p class='mute'>${S.calcMsg}</p>`:''}</div>`}
function calc(){const g=id=>parseFloat($('#'+id).value),s=$('#cs').value,a=g('ca'),h=g('ch'),w=g('cw'),t=g('ct'),ac=+$('#cac').value,pc=+$('#cp').value;if(!(a>0&&h>0&&w>0&&t>0))return;const td=(10*w+6.25*h-5*a+(s==='m'?5:-161))*ac,mn=s==='m'?1500:1200,k=Math.round(t<w?Math.max(td-pc*1100,mn):t>w?td+pc*1100:td),p=Math.round(1.6*t),f=Math.round(k*.25/9),c=Math.max(0,Math.round((k-p*4-f*9)/4));Object.assign(S.goals,{kcal:k,p,c,f,fib:Math.round(k/1000*14)});S.prof={s,a,h,w,t,ac,pc};S.calcMsg=`Daily target: ${k} kcal, protein ${p} g, carbs ${c} g, fat ${f} g.${t!==w?` About ${Math.ceil(Math.abs(w-t)/pc)} weeks to reach ${t} kg.`:''} These are estimates, so check with a doctor or dietitian if you have a medical condition.`;save();render()}
function wsum(){const t=iso(new Date());let st=0,d=new Date(t+'T12:00');if(!(S.log[t]||[]).length)d.setDate(d.getDate()-1);while((S.log[iso(d)]||[]).length){st++;d.setDate(d.getDate()-1)}const ds=[...Array(7)].map((_,i)=>{const x=new Date(t+'T12:00');x.setDate(x.getDate()-i);return iso(x)}),g=goal(0),lg=ds.filter(x=>(S.log[x]||[]).length),K=lg.map(x=>tot(S.log[x])[0]),on=K.filter(k=>Math.abs(k-g)<=g*.1).length,best=lg.length?lg.reduce((a,b)=>Math.abs(tot(S.log[a])[0]-g)<=Math.abs(tot(S.log[b])[0]-g)?a:b):null;return `<div class='card'><div class='mh'><span>🔥 This week</span><span class='mute'>${st}-day streak</span></div><div class='grid' style='margin-top:8px'><div><div class='big'>${lg.length}/7</div><div class='mute'>days logged</div></div><div><div class='big'>${on}</div><div class='mute'>days within 10% of goal</div></div><div><div class='big'>${lg.length?Math.round(K.reduce((a,b)=>a+b,0)/lg.length):0}</div><div class='mute'>avg kcal on logged days</div></div><div><div class='big' style='font-size:22px'>${best?new Date(best+'T12:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric'}):'-'}</div><div class='mute'>best day</div></div></div></div>`}
function applyTheme(){const t=S.theme||'auto',r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t)}
const dk=()=>S.theme==='dark'||((S.theme||'auto')==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
function setTheme(t){S.theme=t;save();render()}
function cycTheme(){setTheme(dk()?'light':'dark')}
function themeCard(){const t=S.theme||'auto';return `<div class='card'><b>Appearance</b><div class='seg' style='margin:10px 0 0'>${[['light','☀️ Light'],['dark','🌙 Dark'],['auto','📱 Auto']].map(([k,l])=>`<button class='${t===k?'on':''}' onclick="setTheme('${k}')">${l}</button>`).join('')}</div><p class='mute' style='margin-bottom:0'>Auto follows your phone setting.</p></div>`}
function setGoal(i,v){v=parseFloat(v);if(v>0){S.goals[N[i][0]]=v;save()}}
function del(i){(S.log[day]||[]).splice(i,1);save();render()}
function openSheet(m){SH={m:m??mealNow()};drawSheet()}
function close_(){SH=null;drawSheet()}
function drawSheet(){
 const el=$("#sheet");
 if(!SH){el.className="";el.innerHTML="";return}
 el.className="open";
 el.innerHTML=`<div class="sh"><div class="hd"><b>${SH.mk?"New food":SH.f?"Amount":"Add food"}</b><button class="ic" onclick="close_()" aria-label="Close">×</button></div>
 <div class="seg">${MEALS.map((x,i)=>`<button class="${SH.m===i?"on":""}" onclick="SH.m=${i};drawSheet()">${SHORT[i]}</button>`).join("")}</div>
 ${SH.ed!=null?editF():SH.f?pick():SH.mk?make():SH.qa?quick():SH.sm?saved():`<input id="q" placeholder="Search foods" oninput="res()" autocomplete="off"><div id="res"></div><div class='seg'><button onclick='SH.qa=1;drawSheet()'>Quick add kcal</button><button onclick='SH.sm=1;drawSheet()'>Saved meals</button><button onclick='SH.mk=1;drawSheet()'>New food</button></div>`}</div>`;
 if(SH.ed==null&&!SH.f&&!SH.mk&&!SH.qa&&!SH.sm)res(); else if(SH.f)pv();
}
function res(){
 const q=($("#q").value||"").toLowerCase(),all=foods();
 const fav=S.fav||[],rec=recent(),rk=n=>fav.includes(n)?0:rec.includes(n)?1:2;
 let r=all.map((f,i)=>({f,i})).filter(x=>x.f.n.toLowerCase().includes(q));
 if(!q)r.sort((a,b)=>rk(a.f.n)-rk(b.f.n));
 r=r.slice(0,40);
 $("#res").innerHTML=r.length?r.map(({f,i})=>`<div class='fr'><button class="fo" onclick="choose(${i})"><span>${em(f.n)} ${esc(f.n)}</span><span class="mute">${f.s?Math.round(f.v[0]*f.s[1]/100)+" kcal / "+f.s[0]:Math.round(f.v[0])+" kcal / 100 g"}</span></button><button class='st' onclick='fv(${i})' aria-label='Favourite'>${fav.includes(f.n)?'★':'☆'}</button></div>`).join(""):`<p class="mute">No match. Create it as your own food.</p>`;
}
function choose(i){SH.f=foods()[i];drawSheet()}
function pick(){
 return `<p style="font-weight:800;margin:6px 0">${esc(SH.f.n)}</p>${SH.f.s?`<div class="seg">${[1,2,3].map(k=>`<button onclick="sv(${k*SH.f.s[1]})">${k} ${esc(SH.f.s[0])} · ${k*SH.f.s[1]}g</button>`).join("")}</div>`:""}<label class="mute" for="gr">Amount in grams</label><input id="gr" type="number" inputmode="decimal" value="${SH.f.s?SH.f.s[1]:100}" min="1" oninput="pv()"><div id="pv" class="mute" style="margin-top:10px"></div>${phIn()}<button class="pri" onclick="addIt()">Add to ${MEALS[SH.m].toLowerCase()}</button><button class="lnk" onclick="SH.f=null;drawSheet()">Back to search</button>`;
}
function pv(){
 const g=parseFloat($("#gr").value)||0,v=SH.f.v;
 $("#pv").innerHTML=[0,1,2,3,4,7].map(i=>`${N[i][1]}: <b>${fmt(v[i]*g/100,i)} ${N[i][2]}</b>`).join(" · ");
}
function sv(g){$("#gr").value=g;pv()}
function addIt(){
 const g=parseFloat($("#gr").value);if(!(g>0))return;
 (S.log[day]=S.log[day]||[]).push({n:SH.f.n,g,m:SH.m,v:SH.f.v,p:SH.ph});save();SH=null;drawSheet();render();
}
function make(){
 return `<p class="mute" style="margin:4px 0">Values per 100 g. Leave unknown nutrients at 0.</p><label class="mute" for="mn">Food name</label><input id="mn"><div class="grid" style="margin-top:8px">`+N.map(([k,t,u],i)=>`<div><label for="m${i}">${t} (${u})</label><input id="m${i}" type="number" inputmode="decimal" min="0" step="any" value="0"></div>`).join("")+`</div><button class="pri" onclick="mkSave()">Save food</button><button class="lnk" onclick="SH.mk=0;drawSheet()">Cancel</button>`;
}
function mkSave(){
 const n=$("#mn").value.trim();if(!n){$("#mn").focus();return}
 const f={n,v:N.map((_,i)=>Math.max(parseFloat($("#m"+i).value)||0,0))};
 S.custom.unshift(f);save();SH.mk=0;SH.f=f;drawSheet();
}
render();
</script></body></html>
